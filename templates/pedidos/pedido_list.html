<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Pedidos</h2>
    <a href="{% url 'pedidos:create' %}" class="btn btn-primary">Novo Pedido</a>
  </div>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Número</th>
        <th>Usuário</th>
        <th>Status</th>
        <th>Valor Total</th>
        <th>Criado em</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for p in pedidos %}
      <tr>
        <td><a href="{% url 'pedidos:detail' p.id %}">{{ p.numero }}</a></td>
        <td>{{ p.usuario }}</td>
        <td>{{ p.status }}</td>
        <td>R$ {{ p.valor_total }}</td>
        <td>{{ p.criado_em }}</td>
        <td>
          <a href="{% url 'pedidos:update' p.id %}" class="btn btn-sm btn-warning">Editar</a>
          <a href="{% url 'pedidos:delete' p.id %}" class="btn btn-sm btn-danger">Excluir</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="6" class="text-center">Nenhum pedido encontrado.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <a href="/" class="btn btn-secondary">Voltar para Home</a>
</div>
</body>
</html>
