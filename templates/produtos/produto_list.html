<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Produtos</h2>
    <a href="{% url 'produtos:create' %}" class="btn btn-primary">Novo Produto</a>
  </div>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Categoria</th>
        <th>Preço</th>
        <th>Estoque</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      {% for p in produtos %}
      <tr>
        <td>{{ p.id }}</td>
        <td><a href="{% url 'produtos:detail' p.id %}">{{ p.nome }}</a></td>
        <td>{{ p.categoria }}</td>
        <td>R$ {{ p.preco }}</td>
        <td>{{ p.estoque }}</td>
        <td>
          <a href="{% url 'produtos:update' p.id %}" class="btn btn-sm btn-warning">Editar</a>
          <a href="{% url 'produtos:delete' p.id %}" class="btn btn-sm btn-danger">Excluir</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="6" class="text-center">Nenhum produto encontrado.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <a href="/" class="btn btn-secondary">Voltar para Home</a>
</div>
</body>
</html>
