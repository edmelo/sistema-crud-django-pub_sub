version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # armazenar arquivos estáticos gerados pelo collectstatic em um volume nomeado
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=core.settings.development
    depends_on:
      - redis
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # montar o diretório contendo arquivos de configuração (ex: default.conf)
      - ./nginx_conf:/etc/nginx/conf.d:ro
      # nginx deve servir os arquivos criados por collectstatic (STATIC_ROOT)
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - app-network

volumes:
  media_volume:
  redis_data:
  static_volume:

networks:
  app-network:
    driver: bridge
